provider: "cache"         # cache | polygon | alpaca
symbols: ["QQQ", "PSQ"]
lookback_days: 800        # how many daily bars to fetch when seeding
force_refresh: false      # if true, ignore existing cache

staleness:
  max_days_ok: 3   # Warn if price_common_date is older than this many calendar days

source_echo:
  enabled: true
  strict_same_asof: true    # if true, raise error when as-of dates differ
  timezone_hint: "US/Eastern"  # informational only; we'll echo it

bar_hygiene:
  enabled: true
  checks:
    ohlc_monotonic: true        # low ≤ min(open,close) ≤ high and high ≥ max(open,close)
    non_negative_volume: true
    positive_prices: true       # open, high, low, close > 0
    max_gap_pct: 0.25           # optional sanity: |close_t - close_t-1|/prev ≤ 25%
  action: "quarantine"          # "quarantine" (skip run) | "drop_last" (remove last row and continue)

# Provider-specific
polygon:
  base_url: "https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/day/{from}/{to}"
alpaca:
  base_url: "https://data.alpaca.markets/v2/stocks/{symbol}/bars?timeframe=1Day&start={from}&end={to}&limit=10000"
